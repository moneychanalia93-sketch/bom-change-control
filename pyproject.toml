[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-change-control"
version = "1.0.0"
description = "A small model of PLM-style BOM validation and engineering change control (standard library only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Money Chanalia" }]
dependencies = []

[project.scripts]
bomcc = "bomcc.cli:main"

[tool.setuptools]
packages = ["bomcc"]
